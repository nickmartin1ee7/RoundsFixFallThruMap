name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  # Bump MAJOR/MINOR here for a new minor release.
  # The PATCH component is auto-incremented from the Actions run number.
  MAJOR: "1"
  MINOR: "0"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: "0"

      - name: Compute version from run number
        run: |
          VERSION="${MAJOR}.${MINOR}.${GITHUB_RUN_NUMBER}"
          TAG="v${VERSION}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "Building release $TAG"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install archive tools
        run: sudo apt-get update && sudo apt-get install --yes p7zip-full zip unzip

      - name: Restore encrypted ROUNDS installation
        env:
          ZIP_PASSWORD: ${{ secrets.ROUNDS_ARCHIVE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ZIP_PASSWORD" || { echo "ROUNDS_ARCHIVE_PASSWORD is not configured." >&2; exit 1; }

          mapfile -t parts < <(find ROUNDS -maxdepth 1 -type f -name '*.7z.*' -print | sort)
          ((${#parts[@]})) || { echo "No encrypted ROUNDS archive parts found under ROUNDS/." >&2; exit 1; }

          cat "${parts[@]}" > ROUNDS/ROUNDS.7z
          7z x -y -p"$ZIP_PASSWORD" -ounpacked ROUNDS/ROUNDS.7z

          rounds_exe=$(find unpacked -type f -iname 'Rounds.exe' -print -quit)
          test -n "$rounds_exe" || { echo "The restored archive does not contain Rounds.exe." >&2; exit 1; }
          echo "ROUNDS_FOLDER=$(dirname "$rounds_exe")" >> "$GITHUB_ENV"

      - name: Align package versions with the computed release version
        run: |
          set -euo pipefail
          python3 - "$VERSION" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          version = sys.argv[1]
          manifest_path = Path("manifest.json")
          manifest = json.loads(manifest_path.read_text())
          manifest["version_number"] = version
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n")

          source_path = Path("RoundsFixFallThruMap/RoundsFixFallThruMap.cs")
          source = source_path.read_text()
          source, substitutions = re.subn(
              r'(private const string Version = ")[^"]+(";)',
              rf'\g<1>{version}\g<2>',
              source,
              count=1,
          )
          if substitutions != 1:
              raise SystemExit("Could not update the plugin Version constant.")
          source_path.write_text(source)
          PY

      - name: Build distributable archive
        run: ./tools/build-release.sh --rounds "$ROUNDS_FOLDER"

      - name: Validate release archive
        run: |
          set -euo pipefail
          archive=$(find artifacts -maxdepth 1 -type f -name '*.zip' -print -quit)
          test -n "$archive" || { echo "No release archive was created." >&2; exit 1; }

          expected=$(printf '%s\n' RoundsFixFallThruMap.dll README.md icon.png manifest.json)
          actual=$(zipinfo -1 "$archive" | sort)
          diff -u <(printf '%s\n' "$expected" | sort) <(printf '%s\n' "$actual")

          test "$(unzip -p "$archive" manifest.json | python3 -c 'import json, sys; print(json.load(sys.stdin)["version_number"])')" = "$VERSION"

      - name: Create or update release tag
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists; leaving it in place."
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          generate_release_notes: true
          files: artifacts/*.zip
